<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetBlock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
li:focus,button:focus,input:focus{outline:none}
body{font:14px/1.5 -apple-system,sans-serif;background:#fff;color:#111}
.top{position:sticky;top:0;background:#fff;z-index:10;box-shadow:0 1px 0 #eee}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
h1{font-size:17px;font-weight:600}
.switch{width:46px;height:26px;background:#ddd;border-radius:13px;position:relative;cursor:pointer;transition:.2s}
.switch.on{background:#34c759}
.switch::after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on::after{left:22px}
.search{padding:0 16px 10px}
.search input{width:100%;padding:8px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#f7f7f7}
.togglebar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid #f0f0f0}
.togglebar label{font-size:13px;color:#666}
.mini{width:36px;height:20px;background:#ddd;border-radius:10px;position:relative;cursor:pointer;transition:.2s}
.mini.on{background:#34c759}
.mini::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mini.on::after{left:18px}
ul{list-style:none}
li{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;gap:12px}
li:active{background:#fafafa}
.icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0;font-size:16px}
.info{flex:1;min-width:0}
.name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:16px;height:16px;border:2px solid #ccc;border-radius:50%;flex-shrink:0}
li.b .dot{background:#ff3b30;border-color:#ff3b30}
.empty{padding:30px;text-align:center;color:#999;cursor:default}
.hint{padding:30px 16px;text-align:center;color:#c0392b;font-size:13px;cursor:default}
</style>
</head>
<body>
<div class="top">
  <header><h1>NetBlock</h1><div class="switch" id="sw"></div></header>
  <div class="search"><input id="q" placeholder="搜索应用"></div>
  <div class="togglebar"><label>显示系统应用</label><div class="mini" id="showSys"></div></div>
</div>
<ul id="list"><li class="empty">加载中...</li></ul>
<script>
const SYS='/sys/kernel/netblock';
const COLORS=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#795548'];
let blocked=new Set(),userApps=[],sysApps=null,filter='',showSys=false;
function hashColor(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function exec(cmd,timeout=8000){return new Promise(r=>{const cb='cb'+Math.random().toString(36).slice(2);const t=setTimeout(()=>{delete window[cb];r({errno:-2,out:''})},timeout);window[cb]=(err,out)=>{clearTimeout(t);delete window[cb];r({errno:err,out:out||''})};try{ksu.exec(cmd,'{}',cb)}catch(e){clearTimeout(t);delete window[cb];r({errno:-1,out:''})}})}
function parseApps(out,isSys){
  const arr=[];
  out.split('\n').forEach(l=>{const m=l.match(/^package:(.+?) uid:(\d+)$/);if(m)arr.push({pkg:m[1],uid:+m[2],label:m[1],sys:isSys})});
  return arr;
}
// 后端优化: 一次 exec 拿全部 (enabled + blocked + 三方应用), 系统应用懒加载
async function init(){
  // 一次 exec 拿全部 (enabled | blocked | 三方 | 系统) — 一次 root shell, 最快
  const r=await exec('cat '+SYS+'/enabled; echo ---; cat '+SYS+'/list; echo ---; pm list packages -U -e -3; echo ---; pm list packages -U -e -s',15000);
  const parts=r.out.split('---');
  if(r.errno!==0||parts.length<4||(parts[0].trim()!=='0'&&parts[0].trim()!=='1')){
    document.getElementById('list').innerHTML='<li class="hint">模块未加载</li>';return;
  }
  const sw=document.getElementById('sw');
  if(parts[0].trim()==='1')sw.classList.add('on');
  sw.onclick=async()=>{const on=sw.classList.toggle('on');await exec('echo '+(on?1:0)+' > '+SYS+'/enabled')};
  blocked=new Set(parts[1].trim().split('\n').filter(Boolean).map(Number));
  userApps=parseApps(parts[2],false);
  sysApps=parseApps(parts[3],true).filter(a=>!userApps.some(u=>u.pkg===a.pkg));
  const ms=document.getElementById('showSys');
  ms.onclick=()=>{showSys=ms.classList.toggle('on');render()};
  document.getElementById('q').oninput=e=>{filter=e.target.value;render()};
  render();
  try{ // label 尽力而为: 全量补 (三方+系统), 缓存有就用
    const all=[...userApps,...sysApps];
    const names=JSON.stringify(all.map(p=>p.pkg));
    const info=JSON.parse(ksu.getPackagesInfo(names));
    info.forEach(i=>{if(!i.error&&i.appLabel){const p=all.find(x=>x.pkg===i.packageName);if(p)p.label=i.appLabel}});
    render();
  }catch(e){}
}
function render(){
  const kw=filter.toLowerCase();
  // 已阻止的应用永远显示 (不受"显示系统应用"开关影响)
  const blockedSys=(sysApps||[]).filter(a=>blocked.has(a.uid));
  let arr=[...userApps,...blockedSys];
  if(showSys&&sysApps)arr=[...arr,...sysApps.filter(a=>!blockedSys.some(b=>b.uid===a.uid))];
  if(kw)arr=arr.filter(a=>a.pkg.includes(kw)||a.label.toLowerCase().includes(kw));
  arr.sort((a,b)=>{
    const ab=blocked.has(a.uid)?0:1,bb=blocked.has(b.uid)?0:1;
    if(ab!==bb)return ab-bb;
    return a.label.localeCompare(b.label);
  });
  document.getElementById('list').innerHTML=arr.length?arr.map(a=>{
    const b=blocked.has(a.uid);
    return `<li class="${b?'b':''}" onclick="tog(${a.uid})"><div class="icon" style="background:${hashColor(a.pkg)}">${(a.label[0]||'?').toUpperCase()}</div><div class="info"><div class="name">${a.label}</div><div class="pkg">${a.pkg}</div></div><span class="dot"></span></li>`;
  }).join(''):'<li class="empty">无应用</li>';
}
async function tog(uid){
  const en=await exec('cat '+SYS+'/enabled',3000);
  if(en.out.trim()!=='1')return;
  if(blocked.has(uid)){await exec('echo '+uid+' > '+SYS+'/remove_uid');blocked.delete(uid)}
  else{await exec('echo '+uid+' > '+SYS+'/add_uid');blocked.add(uid)}
  render();
}
init();
</script>
</body>
</html>
