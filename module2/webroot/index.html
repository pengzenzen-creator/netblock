<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NetBlock</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font: 15px/1.5 -apple-system, "SF Pro Text", Roboto, sans-serif;
  background: #f5f5f5;
  color: #1a1a1a;
  padding-bottom: 80px;
}
header {
  background: #fff;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #e5e5e5;
}
header h1 { font-size: 17px; font-weight: 600; }
.switch {
  width: 48px; height: 28px;
  background: #e0e0e0;
  border-radius: 14px;
  position: relative;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.switch.on { background: #34c759; }
.switch::after {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  background: #fff;
  border-radius: 50%;
  top: 2px; left: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s;
}
.switch.on::after { transform: translateX(20px); }

.search {
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #eee;
}
.search input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  background: #f8f8f8;
}
ul.apps {
  list-style: none;
  background: #fff;
}
ul.apps li {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  gap: 12px;
}
ul.apps li:active { background: #f5f5f5; }
.app-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 500;
  color: #666;
  flex-shrink: 0;
}
.app-info { flex: 1; min-width: 0; }
.app-name {
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-pkg {
  font-size: 12px;
  color: #999;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-check {
  width: 22px; height: 22px;
  border: 2px solid #ccc;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #fff;
}
.app-check.blocked { background: #ff3b30; border-color: #ff3b30; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>NetBlock</h1>
  <div class="switch" id="mainSwitch"></div>
</header>

<div class="search">
  <input type="text" id="searchInput" placeholder="搜索应用">
</div>

<ul class="apps" id="appList"></ul>

<div class="toast" id="toast"></div>

<script>
const SYS = '/sys/kernel/netblock';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function exec(cmd) {
  return new Promise((resolve) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    window[cb] = (errno, stdout) => {
      delete window[cb];
      resolve({ errno, stdout });
    };
    try {
      ksu.exec(cmd, '{}', cb);
    } catch (e) {
      delete window[cb];
      resolve({ errno: -1, stdout: '' });
    }
  });
}

let blockedUids = new Set();

async function loadBlocked() {
  const r = await exec(`cat ${SYS}/list`);
  blockedUids = new Set(r.stdout.trim().split('\n').filter(Boolean).map(Number));
}

async function loadApps() {
  try {
    const pkgs = JSON.parse(ksu.listPackages('user'));
    const info = JSON.parse(ksu.getPackagesInfo(pkgs));
    return info.filter(a => a.uid >= 10000);
  } catch (e) {
    return [];
  }
}

let allApps = [];
let currentFilter = '';

function render() {
  const list = document.getElementById('appList');
  const kw = currentFilter.toLowerCase();
  const apps = allApps.filter(a =>
    !kw || a.appLabel.toLowerCase().includes(kw) || a.packageName.toLowerCase().includes(kw)
  );
  list.innerHTML = apps.map(a => `
    <li onclick="toggle('${a.packageName}', ${a.uid})">
      <div class="app-icon">${(a.appLabel[0] || '?').toUpperCase()}</div>
      <div class="app-info">
        <div class="app-name">${a.appLabel}</div>
        <div class="app-pkg">${a.packageName}</div>
      </div>
      <div class="app-check ${blockedUids.has(a.uid) ? 'blocked' : ''}">${blockedUids.has(a.uid) ? '✕' : ''}</div>
    </li>
  `).join('') || '<li style="padding:24px;text-align:center;color:#999">无匹配应用</li>';
}

async function toggle(pkg, uid) {
  const r = await exec(`cat ${SYS}/enabled`);
  if (r.stdout.trim() !== '1') {
    toast('请先启用拦截');
    return;
  }
  if (blockedUids.has(uid)) {
    await exec(`echo ${uid} > ${SYS}/remove_uid`);
    blockedUids.delete(uid);
    toast(`已解除 ${pkg}`);
  } else {
    await exec(`echo ${uid} > ${SYS}/add_uid`);
    blockedUids.add(uid);
    toast(`已阻止 ${pkg}`);
  }
  render();
}

async function init() {
  const r = await exec(`cat ${SYS}/enabled`);
  const sw = document.getElementById('mainSwitch');
  if (r.stdout.trim() === '1') {
    sw.classList.add('on');
  }
  sw.onclick = async () => {
    const on = sw.classList.toggle('on');
    await exec(`echo ${on ? 1 : 0} > ${SYS}/enabled`);
    toast(on ? '已启用' : '已停用');
  };
  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentFilter = e.target.value;
    render();
  });
  await loadBlocked();
  allApps = await loadApps();
  render();
}

init();
</script>
</body>
</html>
